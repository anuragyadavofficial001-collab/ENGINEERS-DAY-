<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Engineers Day</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                radial-gradient(
                    circle at top left,
                    #172033,
                    #080d18 45%,
                    #050811
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .card {

            width: 420px;

            max-width: 92%;

            padding: 40px;

            border-radius: 22px;

            background: rgba(
                20,
                27,
                42,
                0.92
            );

            border: 1px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.45);
        }

        .brand {

            font-size: 14px;

            letter-spacing: 3px;

            color: #00e5ff;

            margin-bottom: 14px;
        }

        h1 {

            margin: 0 0 8px;

            font-size: 34px;
        }

        .subtitle {

            color: #9ca9c3;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #aab6cd;

            font-size: 14px;
        }

        input {

            width: 100%;

            padding: 14px 15px;

            margin-bottom: 20px;

            border-radius: 12px;

            border: 1px solid
                rgba(255,255,255,0.12);

            background: #0e1523;

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {

            border-color: #00e5ff;
        }

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #00e5ff,
                    #168cff
                );

            color: #06101b;

            font-weight: 700;

            font-size: 15px;

            cursor: pointer;
        }

        .security {

            margin-top: 22px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(
                255,
                255,
                255,
                0.04
            );

            color: #8f9bb2;

            font-size: 12px;

            text-align: center;
        }

        .error {

            margin-bottom: 18px;

            padding: 12px;

            border-radius: 10px;

            background: rgba(
                255,
                70,
                70,
                0.10
            );

            color: #ff9b9b;

            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="card">

    <div class="brand">
        SR GROUP OF INSTITUTION
    </div>

    <h1>Admin Access</h1>

    <div class="subtitle">
        Engineers Day 2026 Control Center
    </div>


    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% for category, message in messages %}

            <div class="error">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form
        method="POST"
        action="{{ url_for('admin.login') }}"
    >

        <label for="username">
            Admin Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
        >


        <label for="password">
            Admin Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            Secure Admin Login →
        </button>

    </form>


    <div class="security">
        🔐 Restricted administrative access
    </div>

</div>

</body>

</html>
